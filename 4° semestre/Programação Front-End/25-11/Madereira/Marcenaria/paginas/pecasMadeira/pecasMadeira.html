<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="pecasMadeira.css">
    <title>Peças de madeira</title>
</head>

<body class="container">
    
    <form class="conteudo" id="form" onsubmit="Post(event)">
        <h1>Cadastro de peças de madeira</h1>

        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome">

        <label for="nome">Nome: </label>
        <select name="tiposMadeira" id="tiposMadeira">
            <option value="1">Carvalho</option>
            <option value="2">Cedrinho</option>
            <option value="3">Peroba Rosa</option>
        </select>

        <label for="comprimento">Comprimento: </label>
        <input type="number" step="any" id="comprimento" name="comprimento">

        <label for="largura">Largura: </label>
        <input type="number" step="any" id="largura" name="largura">

        <label for="altura">Altura: </label>
        <input type="number" step="any" id="altura" name="altura">

        <button type="submit">Salvar</button>
        
        <button type="button">
            <a href="../../index.html">Voltar</a>
        </button>
    </form>

</body>

</html>
