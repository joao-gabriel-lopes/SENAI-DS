<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="tiposMadeira.css">
    <script src="tiposMadeira.js"></script>
    <title>Tipos de madeira</title>
</head>

<body class="container">
    
    <form class="conteudo" id="form" onsubmit="Post(event)">
        <h1>Cadastro de tipos de madeira</h1>

        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome">

        <label for="precoPorVolume">Preço por volume: </label>
        <input type="number" step="any" id="precoPorVolume" name="precoPorVolume">

        <label for="descricao">Descrição: </label>
        <textarea id="descricao" name="descricao" ></textarea>

        <button type="submit">Salvar</button>
        
        <button type="button">
            <a href="../../index.html">Voltar</a>
        </button>
    </form>

</body>

</html>
